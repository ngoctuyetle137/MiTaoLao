<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bí Ẩn</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fef08a, #facc15);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      background: #ffffff;
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(202, 138, 4, 0.25);
      border: 3px solid #eab308;
      max-width: 350px;
      width: 100%;
    }

    #greetingText {
      font-size: 42px;
      font-weight: 800;
      color: #ca8a04;
      margin: 0 0 24px 0;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .btn-yellow {
      background-color: #eab308;
      color: #78350f;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.4);
      transition: all 0.2s ease;
    }

    .btn-yellow:hover {
      background-color: #ca8a04;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(202, 138, 4, 0.45);
    }

    .btn-yellow:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="greetingText">Xin Chào bạn nha</h1>
    <button class="btn-yellow" onclick="doiChu()">Nhấn vào đây</button>
  </div>

  <script>
    function doiChu() {
      const textEl = document.getElementById("greetingText");
      textEl.innerText = "Con Chos Wuoc BAo";
      textEl.style.transform = "scale(1.1)";
      setTimeout(() => {
        textEl.style.transform = "scale(1)";
      }, 200);
    }
  </script>

</body>
</html>
